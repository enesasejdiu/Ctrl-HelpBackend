# Backend CI: formatting, lint and the full test suite (with coverage) on every push to main and every pull request.
# The tests run against a real database server in a service container, on both databases the app supports
# (MySQL 8.4 and MariaDB 11) and on Node 22 and 24: 4 jobs. A fifth job builds the Docker image. A pull request should
# only be merged when all 5 are green.
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR cancels its older, still-running run (no point finishing an outdated one)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.db.name }} · Node ${{ matrix.node }}
    # Pinned, so a new Ubuntu image (ubuntu-latest moving on) never changes the build without a commit
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      # Let every combination finish, so one failure doesn't hide whether the others pass
      fail-fast: false
      matrix:
        # The supported Node versions (Node 20 has reached end of life); same as "engines" in package.json
        node: [22, 24]
        db:
          # MySQL 8.4 runs with its default sql_mode, which includes ONLY_FULL_GROUP_BY
          - name: MySQL 8.4
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - name: MariaDB 11
            image: mariadb:11
            health: healthcheck.sh --connect --innodb_initialized

    # The database server for this job. The tests create their own throwaway ticketflow_test_* database on it
    # (and drop it afterwards), so no DB_NAME is needed.
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          # Each image reads its own variable and ignores the other one
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        # The job's steps only start once the health check passes, i.e. the server accepts connections
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    # Settings the backend reads from the environment (there is no .env file in CI)
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: ci-only-jwt-secret-for-tests-never-used-anywhere-else-4b8e1f0c9d2a7e63
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      # Node from the matrix; npm's download cache is kept between runs, keyed on package-lock.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Which server this job really tests against, and its sql_mode (MySQL 8.4 should list ONLY_FULL_GROUP_BY)
      - name: Show database version and sql_mode
        run: mysql -h 127.0.0.1 -uroot -proot -e "SELECT VERSION() AS version, @@GLOBAL.sql_mode AS sql_mode\G"

      # Exactly the versions in package-lock.json (fails if it is out of sync with package.json)
      - run: npm ci

      # Known security issues in the packages the app runs with (dev tools excluded): high or critical fails the job.
      # Fix with npm audit fix, or by updating the package; Dependabot (.github/dependabot.yml) proposes updates weekly.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # Every file must match the Prettier style (fix locally with npm run format)
      - run: npm run format:check

      # ESLint: any error or warning fails the job
      - run: npm run lint

      # The whole Jest suite, with a coverage report (no minimum is enforced yet)
      - run: npm run test:coverage

      # The email (fake SMTP server in the test process), upload and pagination suites again, 3 runs in a row, each with
      # its own throwaway database, UPLOAD_DIR and SMTP port: they must pass every time, not just once. On one Node
      # version per database, to keep the matrix fast.
      - name: Repeat the email, upload and pagination suites (3 runs)
        if: matrix.node == 24
        run: npm run test:repeat

      # The coverage report, also when tests failed, so a failure can be looked into; kept 7 days
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.db.image == 'mysql:8.4' && 'mysql-8.4' || 'mariadb-11' }}-node-${{ matrix.node }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # Builds the production image (Dockerfile) without pushing it anywhere, and checks deploy/docker-compose.yml, so a
  # broken Dockerfile, .dockerignore or Compose file turns CI red. No database is needed: nothing is run.
  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build the API image (no push)
        run: docker build --tag ticketflow-api:ci .

      # deploy/docker-compose.yml is valid: the example settings with placeholder secrets filled in. The frontend
      # repository isn't checked out here; config doesn't need it.
      - name: Check the Docker Compose file
        run: |
          sed -E 's/^(MYSQL_ROOT_PASSWORD|DB_PASSWORD|JWT_SECRET|BACKUP_PASSWORD)=$/\1=ci-placeholder/' deploy/.env.example > "$RUNNER_TEMP/compose.env"
          docker compose -f deploy/docker-compose.yml --env-file "$RUNNER_TEMP/compose.env" config --quiet

      # The backup service's scripts (deploy/backup/backup.sh, deploy/mysql/backup-user.sh) and the HTTPS check
      # (deploy/check-https.sh); shellcheck is on the runner
      - name: Check the shell scripts
        run: shellcheck deploy/backup/backup.sh deploy/mysql/backup-user.sh deploy/check-https.sh

      # The size, so a sudden jump shows up in the log
      - name: Show the image size
        run: docker image ls ticketflow-api:ci

  # The HTTPS examples (docs/https.md): the proxy's config is checked by the proxy itself (caddy validate + fmt, or
  # nginx -t), then the whole app runs behind it from deploy/docker-compose.yml plus the HTTPS file, with a local
  # certificate instead of Let's Encrypt (that needs a real domain): Caddy with DOMAIN=localhost (its own local CA),
  # nginx with the temporary self-signed certificate of the guide's first-certificate step 1. deploy/check-https.sh
  # then checks the redirect, HSTS, TLS versions, the API, the Secure cookies, the visitor's IP and uploads.
  https:
    name: HTTPS example (${{ matrix.proxy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        proxy: [caddy, nginx]
    defaults:
      run:
        working-directory: deploy
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.https.${{ matrix.proxy }}.yml
      # The frontend repository, checked out next to the backend below (relative to deploy/)
      FRONTEND_DIR: ../frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: enesasejdiu/Ctrl-HelpFrontend
          path: frontend

      # Throwaway settings for this run only: random secrets, and the https address of the test domain
      - name: deploy/.env
        run: |
          domain=${{ matrix.proxy == 'caddy' && 'localhost' || 'tickets.example.com' }}
          {
            sed -E '/^(MYSQL_ROOT_PASSWORD|DB_PASSWORD|BACKUP_PASSWORD|JWT_SECRET|CLIENT_URL|APP_URL)=/d' .env.example
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "BACKUP_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 48)"
            echo "CLIENT_URL=https://$domain"
            echo "APP_URL=https://$domain"
            echo "DOMAIN=$domain"
            echo "ACME_EMAIL=admin@example.com"
          } > .env
          echo "DOMAIN=$domain" >> "$GITHUB_ENV"

      - name: Check the Caddyfile (caddy validate, caddy fmt)
        if: matrix.proxy == 'caddy'
        run: |
          docker compose run --rm --no-deps -e DOMAIN=tickets.example.com caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose run --rm --no-deps caddy caddy fmt /etc/caddy/Caddyfile | diff -u caddy/Caddyfile -

      # The guide's step 1 (a temporary self-signed certificate), then nginx -t on the site with it
      - name: First certificate, step 1, and nginx -t
        if: matrix.proxy == 'nginx'
        run: |
          D=tickets.example.com
          docker compose run --rm --entrypoint sh certbot -c "mkdir -p /etc/letsencrypt/live/$D && openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=$D -keyout /etc/letsencrypt/live/$D/privkey.pem -out /etc/letsencrypt/live/$D/fullchain.pem"
          docker compose run --rm --no-deps proxy nginx -t
          docker compose run --rm certbot --version

      - name: Start the app behind the proxy
        run: |
          docker compose up -d --build --wait --wait-timeout 300
          docker compose ps

      # Demo data, for a user to log in as (the database is brand new and thrown away with the run)
      - name: Demo data
        run: docker compose exec -T api node scripts/seed.js

      - name: Check it (deploy/check-https.sh)
        env:
          RESOLVE: 127.0.0.1
          INSECURE: '1'
          LOGIN_EMAIL: admin@ticketflow.local
          LOGIN_PASSWORD: password123
          PROXY_CONTAINER: ticketflow-${{ matrix.proxy == 'caddy' && 'caddy' || 'proxy' }}-1
          WEB_CONTAINER: ticketflow-web-1
        run: bash check-https.sh "$DOMAIN"

      - name: The web container is not published any more
        run: |
          docker compose port web 8080 && exit 1
          ! curl -s --max-time 5 http://127.0.0.1:8080/

      - name: The renewal container runs (nginx)
        if: matrix.proxy == 'nginx'
        run: test "$(docker inspect --format '{{.State.Running}}' ticketflow-certbot-renew-1)" = true

      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail 40 ${{ matrix.proxy == 'caddy' && 'caddy' || 'proxy certbot-renew' }} web api || true

      - name: Remove the stack and its data
        if: always()
        run: docker compose down -v || true
