# Dependabot: opens pull requests that update dependencies, once a week. Each one runs Backend CI like any other PR,
# so merge it only when all jobs are green.
version: 2
updates:
  # npm packages (package.json / package-lock.json). Minor and patch updates come together in one PR per week;
  # each major update gets its own PR, because it can contain breaking changes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  # The actions used in .github/workflows (actions/checkout, setup-node, upload-artifact), in one PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
