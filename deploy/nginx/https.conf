# nginx in front of TicketFlow, with a Let's Encrypt certificate from certbot: HTTPS on ports 80/443, everything passed
# on to the web container (nginx, port 8080), which serves the app and passes /api on to the API.
# docs/https.md, "Option B: nginx + certbot".
#
# BEFORE USE: replace every tickets.example.com with your domain (server_name twice, the two certificate paths), e.g.
#   sed -i 's/tickets\.example\.com/helpdesk.example.org/g' deploy/nginx/https.conf
#
# With Docker Compose (deploy/docker-compose.https.nginx.yml) this file is the proxy service's site, and the web
# container is reached by its service name. On a server with nginx from apt, put it in /etc/nginx/conf.d/ (or
# sites-available + a link in sites-enabled) and point it at the web container's port on the host instead (the line
# marked "apt" below), e.g.
#   sudo sed -i 's|http://web:8080;|http://127.0.0.1:8080;|' /etc/nginx/conf.d/ticketflow.conf

# ---- Port 80: only the Let's Encrypt challenge; everything else is redirected to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name tickets.example.com;
    server_tokens off;

    # certbot certonly/renew --webroot -w /var/www/certbot writes its challenge files here, and Let's Encrypt reads
    # them over plain HTTP. Never redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Port 443: HTTPS, the app ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tickets.example.com;
    server_tokens off;

    # Written by certbot (fullchain = the certificate plus the intermediate one). certbot renews them in place; nginx
    # reads them on (re)load.
    ssl_certificate /etc/letsencrypt/live/tickets.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tickets.example.com/privkey.pem;

    # Mozilla "intermediate" (https://ssl-config.mozilla.org/): TLS 1.2 and 1.3 only, forward-secret AEAD ciphers for
    # TLS 1.2 (TLS 1.3 picks its own). The DHE ciphers are left out, so no dhparam file is needed.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: browsers stick to HTTPS for this long. Start with 300 (5 minutes); once everything works over HTTPS, raise it
    # to 31536000 (a year). No "preload" (docs/https.md, "HSTS"). The API sends its own (180 days, in production):
    # hidden, so this is the only one.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=300" always;

    # Attachments are 10 MB (plus the upload's overhead); nginx's default is only 1 MB
    client_max_body_size 11m;

    # Docker's DNS, so the web container is looked up when a request comes in: nginx starts even if web isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ticketflow_web http://web:8080;
    # apt (nginx on the server itself, web published on 127.0.0.1:8080): http://127.0.0.1:8080 instead (the resolver
    # line above is then never used, and can stay)

    location / {
        proxy_pass $ticketflow_web;
        proxy_http_version 1.1;
        # The browser's address and the visitor's IP, for the web container and from there the API
        # (TRUST_PROXY_HOPS=2 in deploy/.env: this proxy plus the web container)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Uploads stream through instead of being written to a temporary file first
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
